<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNEMOS — a personal knowledge instrument</title>

    <meta
      name="description"
      content="MNEMOS is a personal knowledge instrument: it keeps what you have read and written, answers from it with the exact passages behind each claim, and remembers how its conclusions changed."
    />

    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph / social. No invented brand assets: the mark is the same
         inline SVG the product uses. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MNEMOS — a personal knowledge instrument" />
    <meta
      property="og:description"
      content="Answers that show their sources. Memory that remembers how it changed."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="/" />
  </head>

    <div id="root"></div>
