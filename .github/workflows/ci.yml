name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=concise .
      - name: Format check
        run: ruff format --check .
      - name: Type check (strict)
        run: mypy app
      - name: Tests
        run: python -m pytest -q

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install harness dependencies
        run: pip install "pgserver>=0.1" PyJWT
      - name: Apply migrations and assert RLS against real PostgreSQL
        run: python scripts/verify-migrations.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests (unit, responsive, accessibility, contrast)
        run: npm test -- --run
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate environment template
        run: python3 scripts/check-env.py
      - name: No committed secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
          if git grep -nE 'SUPABASE_SERVICE_ROLE_KEY' -- 'frontend/**' 'frontend/*'; then
            echo "::error::service-role key referenced in frontend code"
            exit 1
          fi
          echo "OK: no .env tracked, no privileged key in frontend"
